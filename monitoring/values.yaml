# Chart: prometheus-community/kube-prometheus-stack 91.5.1
# Keep Grafana private; use kubectl port-forward to view dashboards.
alertmanager:
  enabled: false
defaultRules:
  create: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
grafana:
  enabled: true
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring
  persistence:
    enabled: false
prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
