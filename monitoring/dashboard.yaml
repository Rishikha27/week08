apiVersion: v1
kind: ConfigMap
metadata:
  name: koalatech-staging-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  koalatech-staging.json: |
    {
      "uid": "koalatech-staging-ops",
      "title": "KoalaTech Staging Operations",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "sit722",
        "staging"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Ready staging pods",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"staging\",condition=\"true\"})",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "title": "Container restarts in staging",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"staging\"})",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "title": "Staging container CPU (cores)",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 16,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"staging\",container!=\"\",image!=\"\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        }
      ]
    }
