name: 02 - Deploy to Staging

on:
  workflow_run:
    workflows:
      - "01 - CI"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate required deployment secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEFAULT_ADMIN_USERNAME: ${{ secrets.DEFAULT_ADMIN_USERNAME }}
          DEFAULT_ADMIN_EMAIL: ${{ secrets.DEFAULT_ADMIN_EMAIL }}
          DEFAULT_ADMIN_PASSWORD: ${{ secrets.DEFAULT_ADMIN_PASSWORD }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          for secret_name in \
            POSTGRES_USER \
            POSTGRES_PASSWORD \
            JWT_SECRET_KEY \
            DEFAULT_ADMIN_USERNAME \
            DEFAULT_ADMIN_EMAIL \
            DEFAULT_ADMIN_PASSWORD \
            AZURE_STORAGE_CONNECTION_STRING
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Required secret $secret_name is empty or unavailable."
              exit 1
            fi
          done

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create staging namespace
        run: |
          kubectl create namespace staging \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace staging \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEFAULT_ADMIN_USERNAME: ${{ secrets.DEFAULT_ADMIN_USERNAME }}
          DEFAULT_ADMIN_EMAIL: ${{ secrets.DEFAULT_ADMIN_EMAIL }}
          DEFAULT_ADMIN_PASSWORD: ${{ secrets.DEFAULT_ADMIN_PASSWORD }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          kubectl create secret generic application-secret \
            --namespace staging \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=DEFAULT_ADMIN_USERNAME="$DEFAULT_ADMIN_USERNAME" \
            --from-literal=DEFAULT_ADMIN_EMAIL="$DEFAULT_ADMIN_EMAIL" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="$DEFAULT_ADMIN_PASSWORD" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/staging/

      - name: Configure PostgreSQL update strategy
        run: |
          for db in user-db student-db lecturer-db course-db enrollment-db; do
            kubectl patch deployment "$db" \
              --namespace staging \
              --type merge \
              -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
          done
          
      - name: Restart PostgreSQL deployments
        run: |
          for db in user-db student-db lecturer-db course-db enrollment-db; do
            kubectl rollout restart deployment/"$db" -n staging
          done

      - name: Wait for PostgreSQL rollouts
        run: |
          for db in user-db student-db lecturer-db course-db enrollment-db; do
            kubectl rollout status deployment/"$db" -n staging --timeout=300s
          done

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ github.event.workflow_run.head_sha }} \
            -n staging

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ github.event.workflow_run.head_sha }} \
            -n staging

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ github.event.workflow_run.head_sha }} \
            -n staging

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ github.event.workflow_run.head_sha }} \
            -n staging

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ github.event.workflow_run.head_sha }} \
            -n staging

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ github.event.workflow_run.head_sha }} \
            -n staging

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend -n staging --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service -n staging --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service -n staging --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service -n staging --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service -n staging --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service -n staging --timeout=300s

      - name: Show staging resources
        run: |
          kubectl get pods -n staging
          kubectl get services -n staging
          kubectl get endpoints -n staging
          kubectl get pvc -n staging

  deploy-monitoring:
    name: Deploy Prometheus and Grafana
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: staging
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.4

      - name: Install or upgrade AKS monitoring
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm upgrade --install sit722-monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --version 91.4.0 \
            --values monitoring/values.yaml \
            --wait --timeout 10m

      - name: Provision KoalaTech staging dashboard
        run: |
          kubectl apply -f monitoring/dashboard.yaml
          kubectl rollout status deployment/sit722-monitoring-grafana \
            --namespace monitoring --timeout=300s
          kubectl get pods,services --namespace monitoring
          kubectl get configmap koalatech-staging-dashboard --namespace monitoring

      - name: Verify Prometheus has collected staging pod metrics
        run: |
          kubectl port-forward -n monitoring \
            svc/sit722-monitoring-kube-pro-prometheus 9090:9090 > /tmp/sit722-prometheus-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            response=$(curl -fsS -G --data-urlencode \
              'query=kube_pod_info{namespace="staging"}' \
              http://127.0.0.1:9090/api/v1/query || true)
            if [ -n "$response" ] && \
               echo "$response" | jq -e '.status == "success" and (.data.result | length > 0)' > /dev/null; then
              echo "$response" | jq -r '.data.result[] | .metric.pod' | sort -u
              echo "Prometheus has collected staging pod metrics."
              exit 0
            fi
            sleep 10
          done
          echo "::error::No staging pod metrics appeared in Prometheus."
          exit 1
